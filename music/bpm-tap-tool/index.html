<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BPM Tap Tool</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="workspace">
        <div class="meter-panel" aria-live="polite">
          <div class="topline">
            <h1 id="app-title">BPM Tap Tool</h1>
            <p id="tempo-name">Waiting for taps</p>
          </div>

          <div class="bpm-readout">
            <span id="bpm-value">--</span>
            <span>BPM</span>
          </div>

          <div class="pulse-strip" aria-hidden="true">
            <span class="pulse-dot"></span>
            <span class="pulse-dot"></span>
            <span class="pulse-dot"></span>
            <span class="pulse-dot"></span>
          </div>

          <div class="stats">
            <div>
              <span>Tap count</span>
              <strong id="tap-count">0</strong>
            </div>
            <div>
              <span>Last interval</span>
              <strong id="interval-value">-- ms</strong>
            </div>
            <div>
              <span>Stability</span>
              <strong id="stability-value">--</strong>
            </div>
          </div>
        </div>

        <button id="tap-button" class="tap-button" type="button" aria-label="Tap tempo">
          <span>Tap</span>
          <small>Space or Enter</small>
        </button>
      </section>

      <section class="controls" aria-label="Tempo controls">
        <div class="control-group">
          <label for="average-range">Average taps</label>
          <div class="range-line">
            <input id="average-range" type="range" min="2" max="16" value="8">
            <output id="average-output" for="average-range">8</output>
          </div>
        </div>

        <div class="control-group">
          <span>Display</span>
          <div class="segmented" role="radiogroup" aria-label="BPM precision">
            <label>
              <input type="radio" name="precision" value="0" checked>
              <span>Whole</span>
            </label>
            <label>
              <input type="radio" name="precision" value="1">
              <span>Decimal</span>
            </label>
          </div>
        </div>

        <button id="reset-button" class="icon-button" type="button" title="Reset taps" aria-label="Reset taps">
          ↺
        </button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
