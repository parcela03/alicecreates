<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Running Pace Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #1f2933;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0f766e;
      margin-top: 0;
    }

    .intro {
      text-align: center;
      color: #5b6570;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .mode-buttons button {
      margin-top: 0;
      background: #e6f4f1;
      color: #0f766e;
      border: 2px solid #0f766e;
    }

    .mode-buttons button.active {
      background: #0f766e;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: span 2;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d6d6d6;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 14px;
      background: #0f766e;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5d56;
    }

    .helper {
      color: #5b6570;
      font-size: 0.9rem;
      margin-top: 6px;
      line-height: 1.4;
    }

    .results {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: #f8faf9;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e4e7ea;
    }

    .card h3 {
      margin-top: 0;
      color: #5b6570;
      font-size: 1rem;
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
      color: #0f766e;
      line-height: 1.2;
    }

    .summary {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .grid,
      .results,
      .mode-buttons {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: span 1;
      }

      .value {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏃 Running Pace Calculator</h1>

    <p class="intro" id="introText">
      Calculate running pace, finish time, and speed from race distance and pace goals.
    </p>

    <div class="mode-buttons">

      <button id="checkModeBtn" class="active" onclick="setMode('check')">
        Check Pace
      </button>

      <button id="planModeBtn" onclick="setMode('plan')">
        Pace Needed
      </button>

      <button id="timeModeBtn" onclick="setMode('time')">
        Predict Time
      </button>

    </div>

    <div class="grid">

      <div class="full">
        <label>Race distance</label>

        <input
          type="number"
          id="distance"
          placeholder="Enter race distance"
          min="0"
          step="0.01"
        >

        <div class="helper">
          Enter any race distance up to a full marathon (42.195 km / 26.219 miles).
        </div>
      </div>

      <div class="full">
        <label>Distance unit</label>

        <select id="unit">
          <option value="km">Kilometres</option>
          <option value="miles">Miles</option>
        </select>
      </div>

      <!-- TIME INPUTS -->

      <div id="timeInputs">

        <div class="grid">

          <div>
            <label>Hours</label>
            <input type="number" id="hours" value="0" min="0">
          </div>

          <div>
            <label>Minutes</label>
            <input type="number" id="minutes" value="0" min="0">
          </div>

          <div class="full">
            <label>Seconds</label>
            <input type="number" id="seconds" value="0" min="0">
          </div>

        </div>

      </div>

      <!-- PACE INPUTS -->

      <div id="paceInputs" class="hidden">

        <div class="grid">

          <div>
            <label>Pace minutes</label>
            <input type="number" id="paceMinutes" value="5" min="0">
          </div>

          <div>
            <label>Pace seconds</label>
            <input type="number" id="paceSeconds" value="0" min="0">
          </div>

          <div class="full">
            <label>Pace unit</label>

            <select id="paceUnit">
              <option value="km">Per kilometre</option>
              <option value="mile">Per mile</option>
            </select>
          </div>

        </div>

      </div>

    </div>

    <button onclick="calculate()">
      Calculate
    </button>

    <div id="summary" class="summary hidden"></div>

    <div class="results">

      <div class="card">
        <h3>Pace per km</h3>
        <div class="value" id="paceKm">--</div>
      </div>

      <div class="card">
        <h3>Pace per mile</h3>
        <div class="value" id="paceMile">--</div>
      </div>

      <div class="card">
        <h3>Speed km/h</h3>
        <div class="value" id="speedKm">--</div>
      </div>

      <div class="card">
        <h3>Estimated finish time</h3>
        <div class="value" id="finishTime">--</div>
      </div>

    </div>

  </div>

  <script>

    let currentMode = 'check';

    function setMode(mode) {

      currentMode = mode;

      document.getElementById('checkModeBtn').classList.toggle(
        'active',
        mode === 'check'
      );

      document.getElementById('planModeBtn').classList.toggle(
        'active',
        mode === 'plan'
      );

      document.getElementById('timeModeBtn').classList.toggle(
        'active',
        mode === 'time'
      );

      const timeInputs = document.getElementById('timeInputs');
      const paceInputs = document.getElementById('paceInputs');

      if (mode === 'time') {
        timeInputs.classList.add('hidden');
        paceInputs.classList.remove('hidden');
      } else {
        timeInputs.classList.remove('hidden');
        paceInputs.classList.add('hidden');
      }

      const intro = document.getElementById('introText');

      if (mode === 'check') {
        intro.textContent =
          'Calculate your running pace and speed from your completed run.';
      }

      if (mode === 'plan') {
        intro.textContent =
          'Enter your target race time to see the pace you need to run.';
      }

      if (mode === 'time') {
        intro.textContent =
          'Enter your pace and race distance to predict your finish time.';
      }

      clearResults();
    }

    function clearResults() {

      document.getElementById('paceKm').textContent = '--';
      document.getElementById('paceMile').textContent = '--';
      document.getElementById('speedKm').textContent = '--';
      document.getElementById('finishTime').textContent = '--';

      const summary = document.getElementById('summary');

      summary.classList.add('hidden');
      summary.textContent = '';
    }

    function formatPace(minutesDecimal) {

      let mins = Math.floor(minutesDecimal);
      let secs = Math.round((minutesDecimal - mins) * 60);

      if (secs === 60) {
        mins += 1;
        secs = 0;
      }

      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function formatTime(totalSeconds) {

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = Math.round(totalSeconds % 60);

      if (hours > 0) {
        return `${hours}h ${minutes}m ${seconds}s`;
      }

      return `${minutes}m ${seconds}s`;
    }

    function calculate() {

      const distance = parseFloat(
        document.getElementById('distance').value
      );

      const unit = document.getElementById('unit').value;

      if (!distance || distance <= 0) {
        alert('Please enter a valid distance.');
        return;
      }

      const maxDistance =
        unit === 'km'
          ? 42.195
          : 26.219;

      if (distance > maxDistance) {
        alert(
          'Please enter a distance up to marathon distance.'
        );
        return;
      }

      let distanceKm;
      let distanceMiles;

      if (unit === 'km') {
        distanceKm = distance;
        distanceMiles = distance * 0.621371;
      } else {
        distanceMiles = distance;
        distanceKm = distance * 1.60934;
      }

      let totalHours;
      let totalSeconds;
      let paceKm;
      let paceMile;
      let speedKm;

      /* =========================
         TIME MODE
      ========================== */

      if (currentMode === 'time') {

        const paceMinutes =
          parseFloat(document.getElementById('paceMinutes').value) || 0;

        const paceSeconds =
          parseFloat(document.getElementById('paceSeconds').value) || 0;

        const paceUnit =
          document.getElementById('paceUnit').value;

        const paceDecimal =
          paceMinutes + (paceSeconds / 60);

        if (paceDecimal <= 0) {
          alert('Please enter a valid pace.');
          return;
        }

        if (paceUnit === 'km') {

          paceKm = paceDecimal;
          paceMile = paceDecimal * 1.60934;

        } else {

          paceMile = paceDecimal;
          paceKm = paceDecimal / 1.60934;
        }

        totalSeconds = paceKm * distanceKm * 60;
        totalHours = totalSeconds / 3600;

        speedKm = distanceKm / totalHours;

      }

      /* =========================
         CHECK + PLAN MODES
      ========================== */

      else {

        const hours =
          parseFloat(document.getElementById('hours').value) || 0;

        const minutes =
          parseFloat(document.getElementById('minutes').value) || 0;

        const seconds =
          parseFloat(document.getElementById('seconds').value) || 0;

        totalSeconds =
          (hours * 3600) +
          (minutes * 60) +
          seconds;

        totalHours = totalSeconds / 3600;

        if (totalHours <= 0) {
          alert('Please enter a valid time.');
          return;
        }

        paceKm =
          (totalHours * 60) / distanceKm;

        paceMile =
          (totalHours * 60) / distanceMiles;

        speedKm =
          distanceKm / totalHours;
      }

      /* =========================
         RESULTS
      ========================== */

      document.getElementById('paceKm').textContent =
        `${formatPace(paceKm)} /km`;

      document.getElementById('paceMile').textContent =
        `${formatPace(paceMile)} /mile`;

      document.getElementById('speedKm').textContent =
        `${speedKm.toFixed(2)} km/h`;

      document.getElementById('finishTime').textContent =
        formatTime(totalSeconds);

      const summary =
        document.getElementById('summary');

      summary.classList.remove('hidden');

      if (currentMode === 'check') {

        summary.textContent =
          `You completed ${distance} ${unit} in ${formatTime(totalSeconds)} at an average pace of ${formatPace(paceKm)} per kilometre.`;
      }

      if (currentMode === 'plan') {

        summary.textContent =
          `To complete ${distance} ${unit} in ${formatTime(totalSeconds)}, you need to maintain a pace of ${formatPace(paceKm)} per kilometre.`;
      }

      if (currentMode === 'time') {

        summary.textContent =
          `At a pace of ${formatPace(paceKm)} per kilometre, your estimated finish time for ${distance} ${unit} is ${formatTime(totalSeconds)}.`;
      }
    }

  </script>

</body>
</html>
