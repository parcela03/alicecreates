<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Running Pace Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #1f2933;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0f766e;
      margin-top: 0;
    }

    .intro {
      text-align: center;
      color: #5b6570;
      margin-bottom: 24px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .mode-buttons button {
      margin-top: 0;
      background: #e6f4f1;
      color: #0f766e;
      border: 2px solid #0f766e;
    }

    .mode-buttons button.active {
      background: #0f766e;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: span 2;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d6d6d6;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 14px;
      background: #0f766e;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5d56;
    }

    .helper {
      color: #5b6570;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .results {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: #f8faf9;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e4e7ea;
    }

    .card h3 {
      margin-top: 0;
      color: #5b6570;
      font-size: 1rem;
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
      color: #0f766e;
    }

    .summary {
      margin-top: 24px;
      padding: 18px;
      border-radius: 18px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      font-weight: bold;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .grid,
      .results,
      .mode-buttons {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: span 1;
      }

      .value {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏃 Running Pace Calculator</h1>

    <p class="intro" id="introText">
      Calculate your running pace and speed from distance and time.
    </p>

    <div class="mode-buttons">
      <button id="checkModeBtn" class="active" onclick="setMode('check')">
        Check my pace
      </button>

      <button id="planModeBtn" onclick="setMode('plan')">
        What pace do I need?
      </button>
    </div>

    <div class="grid">

      <div class="full">
        <label>Distance</label>
        <input type="number" id="distance" placeholder="e.g. 5" min="0" step="0.01">
      </div>

      <div class="full">
        <label>Unit</label>
        <select id="unit">
          <option value="km">Kilometres</option>
          <option value="miles">Miles</option>
        </select>
      </div>

      <div class="full" id="goalPresetBox">
        <label>Choose a common distance</label>
        <select id="presetDistance" onchange="applyPresetDistance()">
          <option value="">Select optional preset</option>
          <option value="5">5K</option>
          <option value="10">10K</option>
          <option value="21.0975">Half marathon</option>
          <option value="42.195">Marathon</option>
        </select>
        <div class="helper">This fills the distance in kilometres.</div>
      </div>

      <div>
        <label>Hours</label>
        <input type="number" id="hours" value="0" min="0">
      </div>

      <div>
        <label>Minutes</label>
        <input type="number" id="minutes" value="0" min="0">
      </div>

      <div class="full">
        <label>Seconds</label>
        <input type="number" id="seconds" value="0" min="0">
      </div>

    </div>

    <button onclick="calculate()">
      Calculate
    </button>

    <div id="summary" class="summary hidden"></div>

    <div class="results">

      <div class="card">
        <h3>Pace per km</h3>
        <div class="value" id="paceKm">--</div>
      </div>

      <div class="card">
        <h3>Pace per mile</h3>
        <div class="value" id="paceMile">--</div>
      </div>

      <div class="card">
        <h3>Speed km/h</h3>
        <div class="value" id="speedKm">--</div>
      </div>

      <div class="card">
        <h3>Speed mph</h3>
        <div class="value" id="speedMph">--</div>
      </div>

    </div>

  </div>

  <script>
    let currentMode = 'check';

    function setMode(mode) {
      currentMode = mode;

      document.getElementById('checkModeBtn').classList.toggle('active', mode === 'check');
      document.getElementById('planModeBtn').classList.toggle('active', mode === 'plan');

      document.getElementById('introText').textContent =
        mode === 'check'
          ? 'Calculate your running pace and speed from distance and time.'
          : 'Enter your distance and target time to see the pace and speed you need.';

      document.querySelector('button[onclick="calculate()"]').textContent =
        mode === 'check'
          ? 'Calculate my pace'
          : 'Calculate the pace I need';

      clearResults();
    }

    function applyPresetDistance() {
      const preset = document.getElementById('presetDistance').value;

      if (preset) {
        document.getElementById('distance').value = preset;
        document.getElementById('unit').value = 'km';
      }
    }

    function formatPace(minutesDecimal) {
      let mins = Math.floor(minutesDecimal);
      let secs = Math.round((minutesDecimal - mins) * 60);

      if (secs === 60) {
        mins += 1;
        secs = 0;
      }

      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = Math.round(totalSeconds % 60);

      if (hours > 0) {
        return `${hours}h ${minutes}m ${seconds}s`;
      }

      return `${minutes}m ${seconds}s`;
    }

    function clearResults() {
      document.getElementById('paceKm').textContent = '--';
      document.getElementById('paceMile').textContent = '--';
      document.getElementById('speedKm').textContent = '--';
      document.getElementById('speedMph').textContent = '--';
      document.getElementById('summary').classList.add('hidden');
      document.getElementById('summary').textContent = '';
    }

    function calculate() {
      const distance = parseFloat(document.getElementById('distance').value);
      const unit = document.getElementById('unit').value;

      const hours = parseFloat(document.getElementById('hours').value) || 0;
      const minutes = parseFloat(document.getElementById('minutes').value) || 0;
      const seconds = parseFloat(document.getElementById('seconds').value) || 0;

      const totalSeconds = (hours * 3600) + (minutes * 60) + seconds;
      const totalHours = totalSeconds / 3600;

      if (!distance || distance <= 0 || totalSeconds <= 0) {
        alert('Please enter a valid distance and time.');
        return;
      }

      let distanceKm;
      let distanceMiles;

      if (unit === 'km') {
        distanceKm = distance;
        distanceMiles = distance * 0.621371;
      } else {
        distanceMiles = distance;
        distanceKm = distance * 1.60934;
      }

      const paceKm = (totalHours * 60) / distanceKm;
      const paceMile = (totalHours * 60) / distanceMiles;

      const speedKm = distanceKm / totalHours;
      const speedMph = distanceMiles / totalHours;

      document.getElementById('paceKm').textContent = `${formatPace(paceKm)} /km`;
      document.getElementById('paceMile').textContent = `${formatPace(paceMile)} /mile`;
      document.getElementById('speedKm').textContent = speedKm.toFixed(2);
      document.getElementById('speedMph').textContent = speedMph.toFixed(2);

      const summary = document.getElementById('summary');
      summary.classList.remove('hidden');

      if (currentMode === 'check') {
        summary.textContent =
          `You ran ${distance} ${unit} in ${formatTime(totalSeconds)}. Your pace was ${formatPace(paceKm)} per km.`;
      } else {
        summary.textContent =
          `To complete ${distance} ${unit} in ${formatTime(totalSeconds)}, you need to run at ${formatPace(paceKm)} per km, or ${formatPace(paceMile)} per mile.`;
      }
    }
  </script>

</body>
</html>
